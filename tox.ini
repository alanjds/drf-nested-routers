[tox]
# see https://docs.djangoproject.com/en/5.2/faq/install/#what-python-version-can-i-use-with-django
envlist =
       py{311,312,313,314,315}-django5.2-drf3.18
       py312-mypy

[gh-actions]
python =
       3.11: py311
       3.12: py312
       3.13: py313
       3.14: py314
       3.15: py315

[testenv]
commands = ./runtests.py --nolint
allowlist_externals = *
setenv =
       PYTHONDONTWRITEBYTECODE=1
deps =
       django5.2: Django>=5.2,<6.0
       drf3.18: djangorestframework>=3.18.2,<3.19
       -rrequirements-tox.txt

[testenv:py312-flake8]
commands = ./runtests.py --lintonly
deps =
       -rrequirements-tox.txt

[testenv:py312-docs]
commands = mkdocs build
deps =
       mkdocs>=1.3.0

[testenv:py312-mypy]
commands = mypy rest_framework_nested
deps =
       -rrequirements-tox.txt
       django-stubs==6.0.7
       djangorestframework-stubs==3.17.0
